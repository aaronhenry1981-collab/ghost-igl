name: Apply Recon Member Profile Upgrade v4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-member-profile-upgrade-v4.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply guarded source migration
        run: python3 scripts/apply-member-profile-upgrade.py
      - name: Validate migration
        run: |
          npm ci
          npm test
          node --test test/member-profile-admin.test.mjs
          npm run lint
          npm run build
      - name: Commit upgraded member experience
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Recon Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add lambda/subscription/index.mjs lambda/admin/index.mjs src/components/ProfileSetupModal.jsx src/pages/DashboardPage.jsx src/pages/AccountPage.jsx src/pages/AdminPage.jsx test/member-profile-admin.test.mjs
          git commit -m "feat: enrich member identity and admin directory"
          git push origin HEAD:main
