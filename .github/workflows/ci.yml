name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: aws-actions/setup-sam@v2
      - run: npm ci
      - name: Install patch watcher dependencies
        run: npm ci --prefix lambda/ubisoft-patch-watcher
      - name: Patch watcher tests
        run: npm run test:patch-watcher
      - name: Contract tests
        run: npm test
      - name: Install customer-success dependencies
        run: npm ci --prefix lambda/customer-success
      - name: Customer-success tests (lifecycle, entitlements, API auth, outreach safety)
        run: npm run test:customer-success
      - name: Validate customer-success SAM stack
        run: sam validate --lint --template-file aws/customer-success-template.yaml
      - name: Build customer-success SAM stack
        run: sam build --template-file aws/customer-success-template.yaml --build-dir .aws-sam-customer-success
      - name: Validate player-data SAM stack
        run: sam validate --lint --template-file aws/player-data-template.yaml
      - name: Build player-data SAM stack
        run: sam build --template-file aws/player-data-template.yaml --build-dir .aws-sam-player-data
      - run: npm run lint
      - run: npm run build
      - name: Product truth
        run: npm run check:truth
      - run: npm run check:metadata
      - run: npm run test:rss
