name: Apply Recon Member Profile Upgrade v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-member-profile-upgrade-v2.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply guarded source migration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old[:90]!r}')
              p.write_text(s.replace(old, new, 1))

          replace_once('lambda/subscription/index.mjs', "  'display_name',          // \"gamer tag\" — public-facing display name\n", "  'first_name',            // real first name — private account identity\n  'last_name',             // real last name — private account identity\n  'display_name',          // preferred/public-facing name or gamer identity\n")
          replace_once('lambda/subscription/index.mjs', "  // Minimum required fields for \"complete\" status. Display name + platform\n  // is enough to personalize emails and content. Everything else is bonus.\n  return !!(p.display_name && p.platform)\n", "  // New identity baseline: collect a real name plus the preferred/public\n  // display name and platform. Existing users missing first/last name will see\n  // the setup prompt again so Recon can progressively complete their profile.\n  return !!(p.first_name && p.last_name && p.display_name && p.platform)\n")

          replace_once('src/components/ProfileSetupModal.jsx', "// who his customers are when emailing them — display name, platform, region,\n", "// who his customers are when emailing them — real first/last name, preferred\n// display name, platform, region,\n")
          replace_once('src/components/ProfileSetupModal.jsx', "  const [form, setForm] = useState({\n    display_name: profile?.display_name || '',\n", "  const [form, setForm] = useState({\n    first_name: profile?.first_name || '',\n    last_name: profile?.last_name || '',\n    display_name: profile?.display_name || '',\n")
          replace_once('src/components/ProfileSetupModal.jsx', "    if (!form.display_name.trim()) {\n      setError('Display name is required so we know what to call you.')\n", "    if (!form.first_name.trim() || !form.last_name.trim()) {\n      setError('First and last name are required for your account profile.')\n      setStep(1)\n      return\n    }\n    if (!form.display_name.trim()) {\n      setError('Preferred name is required so Recon knows what to call you.')\n")
          replace_once('src/components/ProfileSetupModal.jsx', "      const body = {\n        display_name: form.display_name.trim(),\n", "      const body = {\n        first_name: form.first_name.trim(),\n        last_name: form.last_name.trim(),\n        display_name: form.display_name.trim(),\n")
          replace_once('src/components/ProfileSetupModal.jsx', "            <Field label=\"Display name\" required>\n              <input type=\"text\" value={form.display_name} onChange={(e) => setField('display_name', e.target.value)} placeholder=\"What should we call you?\" maxLength={60} className=\"testi-input\" autoFocus />\n            </Field>\n", "            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8 }}>\n              <Field label=\"First name\" required>\n                <input type=\"text\" value={form.first_name} onChange={(e) => setField('first_name', e.target.value)} placeholder=\"Aaron\" maxLength={60} className=\"testi-input\" autoFocus autoComplete=\"given-name\" />\n              </Field>\n              <Field label=\"Last name\" required>\n                <input type=\"text\" value={form.last_name} onChange={(e) => setField('last_name', e.target.value)} placeholder=\"Henry\" maxLength={60} className=\"testi-input\" autoComplete=\"family-name\" />\n              </Field>\n            </div>\n            <Field label=\"Preferred name / gamer name\" required>\n              <input type=\"text\" value={form.display_name} onChange={(e) => setField('display_name', e.target.value)} placeholder=\"What should Recon call you?\" maxLength={60} className=\"testi-input\" autoComplete=\"nickname\" />\n            </Field>\n")
          replace_once('src/components/ProfileSetupModal.jsx', "                if (!form.display_name.trim()) { setError('Display name is required.'); return }\n                if (!form.platform) { setError('Pick a platform.'); return }\n", "                if (!form.first_name.trim() || !form.last_name.trim()) { setError('First and last name are required.'); return }\n                if (!form.display_name.trim()) { setError('Preferred name is required.'); return }\n                if (!form.platform) { setError('Pick a platform.'); return }\n")

          replace_once('src/pages/DashboardPage.jsx', "  const { user, plan, isAdmin, loading: authLoading } = useAuth()\n", "  const { user, plan, isAdmin, profile, loading: authLoading } = useAuth()\n")
          replace_once('src/pages/DashboardPage.jsx', "  const firstName = (user.email || '').split('@')[0].split('.')[0].split('+')[0]\n  const niceName = firstName ? firstName.charAt(0).toUpperCase() + firstName.slice(1) : 'player'\n", "  const profileName = (profile?.first_name || '').trim() || (profile?.display_name || '').trim().split(/\\s+/)[0]\n  const emailFallback = (user.email || '').split('@')[0].split('.')[0].split('+')[0]\n  const rawName = profileName || emailFallback\n  const niceName = rawName ? rawName.charAt(0).toUpperCase() + rawName.slice(1) : 'player'\n")

          replace_once('src/pages/AccountPage.jsx', "  const [form, setForm] = useState({\n    discord_handle: '',\n", "  const [form, setForm] = useState({\n    first_name: '',\n    last_name: '',\n    display_name: '',\n    discord_handle: '',\n")
          replace_once('src/pages/AccountPage.jsx', "          <form onSubmit={saveProfile} className=\"account-form\">\n            <Field label=\"Discord handle\" placeholder=\"yourname or yourname#1234\">\n", "          <form onSubmit={saveProfile} className=\"account-form\">\n            <div className=\"account-form-row\">\n              <Field label=\"First name\">\n                <input type=\"text\" maxLength={100} value={form.first_name} onChange={(e) => setForm({ ...form, first_name: e.target.value })} className=\"account-input\" autoComplete=\"given-name\" />\n              </Field>\n              <Field label=\"Last name\">\n                <input type=\"text\" maxLength={100} value={form.last_name} onChange={(e) => setForm({ ...form, last_name: e.target.value })} className=\"account-input\" autoComplete=\"family-name\" />\n              </Field>\n            </div>\n            <Field label=\"Preferred name / gamer name\">\n              <input type=\"text\" maxLength={100} value={form.display_name} onChange={(e) => setForm({ ...form, display_name: e.target.value })} className=\"account-input\" autoComplete=\"nickname\" />\n            </Field>\n\n            <Field label=\"Discord handle\" placeholder=\"yourname or yourname#1234\">\n")
          replace_once('src/pages/AccountPage.jsx', "  const keys = ['discord_handle', 'gamer_id', 'platform', 'preferred_server', 'main_role']\n", "  const keys = ['first_name', 'last_name', 'display_name', 'discord_handle', 'gamer_id', 'platform', 'preferred_server', 'main_role']\n")

          replace_once('lambda/admin/index.mjs', "      ProjectionExpression: 'email, active_game_id, last_seen_at',\n", "      ProjectionExpression: 'email, first_name, last_name, display_name, platform, region, discord_username, discord_handle, gamer_id, preferred_server, main_role, active_game_id, last_seen_at, referral_source, game_profiles_json',\n")
          replace_once('lambda/admin/index.mjs', "    const profile = profileByEmail.get(email)\n    return {\n", "    const profile = profileByEmail.get(email)\n    let gameProfiles = {}\n    try { gameProfiles = profile?.game_profiles_json ? JSON.parse(profile.game_profiles_json) : {} } catch { gameProfiles = {} }\n    const r6 = gameProfiles?.r6 || {}\n    return {\n")
          replace_once('lambda/admin/index.mjs', "      active_game_id: profile?.active_game_id || null,\n      last_seen_at: profile?.last_seen_at || null,\n      referral_source: profile?.referral_source || null,\n", "      first_name: profile?.first_name || null,\n      last_name: profile?.last_name || null,\n      display_name: profile?.display_name || null,\n      platform: profile?.platform || null,\n      region: profile?.region || profile?.preferred_server || null,\n      discord_username: profile?.discord_username || profile?.discord_handle || null,\n      gamer_id: profile?.gamer_id || null,\n      active_game_id: profile?.active_game_id || null,\n      last_seen_at: profile?.last_seen_at || null,\n      referral_source: profile?.referral_source || null,\n      r6_ubisoft_username: r6.ubisoft_username || null,\n      r6_rank: r6.rank || null,\n      r6_goal_rank: r6.goal_rank || null,\n      r6_main_role: r6.main_role || profile?.main_role || null,\n")
          replace_once('lambda/admin/index.mjs', "  for (const [email, sub] of subByEmail.entries()) {\n    if (claimedSubEmails.has(email)) continue\n    users.push({\n", "  for (const [email, sub] of subByEmail.entries()) {\n    if (claimedSubEmails.has(email)) continue\n    const profile = profileByEmail.get(email)\n    let gameProfiles = {}\n    try { gameProfiles = profile?.game_profiles_json ? JSON.parse(profile.game_profiles_json) : {} } catch { gameProfiles = {} }\n    const r6 = gameProfiles?.r6 || {}\n    users.push({\n")
          replace_once('lambda/admin/index.mjs', "      active_game_id: profileByEmail.get(email)?.active_game_id || null,\n      last_seen_at: profileByEmail.get(email)?.last_seen_at || null,\n      referral_source: profileByEmail.get(email)?.referral_source || null,\n", "      first_name: profile?.first_name || null,\n      last_name: profile?.last_name || null,\n      display_name: profile?.display_name || null,\n      platform: profile?.platform || null,\n      region: profile?.region || profile?.preferred_server || null,\n      discord_username: profile?.discord_username || profile?.discord_handle || null,\n      gamer_id: profile?.gamer_id || null,\n      active_game_id: profile?.active_game_id || null,\n      last_seen_at: profile?.last_seen_at || null,\n      referral_source: profile?.referral_source || null,\n      r6_ubisoft_username: r6.ubisoft_username || null,\n      r6_rank: r6.rank || null,\n      r6_goal_rank: r6.goal_rank || null,\n      r6_main_role: r6.main_role || profile?.main_role || null,\n")
          replace_once('lambda/admin/index.mjs', "  const ddbSummary = computeSummary(subs)\n", "  users.sort((a, b) => {\n    const aMs = a.created_at ? Date.parse(a.created_at) : 0\n    const bMs = b.created_at ? Date.parse(b.created_at) : 0\n    return bMs - aMs\n  })\n\n  const ddbSummary = computeSummary(subs)\n")

          replace_once('src/pages/AdminPage.jsx', "        (u.email || '').toLowerCase().includes(q) ||\n        (u.stripe_customer_id || '').toLowerCase().includes(q)\n", "        (u.email || '').toLowerCase().includes(q) ||\n        (u.first_name || '').toLowerCase().includes(q) ||\n        (u.last_name || '').toLowerCase().includes(q) ||\n        (u.display_name || '').toLowerCase().includes(q) ||\n        (u.discord_username || '').toLowerCase().includes(q) ||\n        (u.gamer_id || '').toLowerCase().includes(q) ||\n        (u.r6_ubisoft_username || '').toLowerCase().includes(q) ||\n        (u.platform || '').toLowerCase().includes(q) ||\n        (u.region || '').toLowerCase().includes(q) ||\n        (u.r6_rank || '').toLowerCase().includes(q) ||\n        (u.r6_main_role || '').toLowerCase().includes(q) ||\n        (u.stripe_customer_id || '').toLowerCase().includes(q)\n")
          replace_once('src/pages/AdminPage.jsx', "    const cols = ['email', 'plan', 'sub_status', 'cognito_status', 'referral_source', 'created_at', 'current_period_end', 'stripe_customer_id']\n", "    const cols = ['first_name', 'last_name', 'display_name', 'email', 'platform', 'region', 'discord_username', 'gamer_id', 'r6_ubisoft_username', 'r6_rank', 'r6_goal_rank', 'r6_main_role', 'active_game_id', 'last_seen_at', 'referral_source', 'plan', 'sub_status', 'cognito_status', 'created_at', 'current_period_end', 'stripe_customer_id']\n")
          replace_once('src/pages/AdminPage.jsx', "            placeholder=\"Search by email or Stripe ID…\"\n", "            placeholder=\"Search name, email, Discord, Ubisoft/gamertag, platform, region or Stripe ID…\"\n")
          replace_once('src/pages/AdminPage.jsx', "                  <th>Email</th>\n                  <th>Plan</th>\n", "                  <th>Member</th>\n                  <th>Gaming identity</th>\n                  <th>Plan</th>\n")
          replace_once('src/pages/AdminPage.jsx', "                      <td className=\"admin-mono\">\n                        {u.email || '-'}\n", "                      <td>\n                        <div style={{ fontWeight: 700 }}>{[u.first_name, u.last_name].filter(Boolean).join(' ') || u.display_name || 'Name not collected'}</div>\n                        {u.display_name && <div style={{ opacity: 0.7, fontSize: '0.78rem' }}>Preferred: {u.display_name}</div>}\n                        <div className=\"admin-mono\" style={{ opacity: 0.75, fontSize: '0.78rem' }}>{u.email || '-'}</div>\n")
          replace_once('src/pages/AdminPage.jsx', "                      </td>\n                      <td>\n                        <span className={`admin-badge admin-badge-${u.plan}`}>{u.plan}</span>\n", "                      </td>\n                      <td>\n                        <div>{u.r6_ubisoft_username || u.gamer_id || <span style={{ opacity: 0.4 }}>—</span>}</div>\n                        <div style={{ opacity: 0.65, fontSize: '0.78rem' }}>\n                          {[u.platform, u.region, u.r6_rank, u.r6_main_role].filter(Boolean).join(' · ') || 'No gaming details'}\n                        </div>\n                        {u.discord_username && <div style={{ opacity: 0.65, fontSize: '0.78rem' }}>Discord: {u.discord_username}</div>}\n                      </td>\n                      <td>\n                        <span className={`admin-badge admin-badge-${u.plan}`}>{u.plan}</span>\n")

          Path('test/member-profile-admin.test.mjs').write_text(r'''import test from 'node:test'\nimport assert from 'node:assert/strict'\nimport { readFileSync } from 'node:fs'\n\nconst read = (path) => readFileSync(new URL(`../${path}`, import.meta.url), 'utf8')\n\ntest('member identity fields drive dashboard and admin directory', () => {\n  const subscription = read('lambda/subscription/index.mjs')\n  const dashboard = read('src/pages/DashboardPage.jsx')\n  const adminApi = read('lambda/admin/index.mjs')\n  const adminUi = read('src/pages/AdminPage.jsx')\n  assert.match(subscription, /'first_name'/)\n  assert.match(subscription, /'last_name'/)\n  assert.match(subscription, /p\.first_name && p\.last_name/)\n  assert.match(dashboard, /profile\?\.first_name/)\n  assert.match(adminApi, /r6_ubisoft_username/)\n  assert.match(adminApi, /users\.sort/)\n  assert.match(adminUi, /Search name, email, Discord/)\n  assert.match(adminUi, /u\.first_name/)\n  assert.match(adminUi, /r6_ubisoft_username/)\n})\n''')
          PY

      - name: Validate migration
        run: |
          npm ci
          npm test
          node --test test/member-profile-admin.test.mjs
          npm run lint
          npm run build

      - name: Commit upgraded member experience
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Recon Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add lambda/subscription/index.mjs lambda/admin/index.mjs src/components/ProfileSetupModal.jsx src/pages/DashboardPage.jsx src/pages/AccountPage.jsx src/pages/AdminPage.jsx test/member-profile-admin.test.mjs
          git commit -m "feat: enrich member identity and admin directory"
          git push origin HEAD:main
