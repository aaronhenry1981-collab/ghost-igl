AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >-
  Recon 6 customer-success layer (isolated stack): customer home projection,
  customer-success CRM, conversations, outreach records (delivery disabled)
  and in-product feedback. Reads existing Recon tables read-only; owns one
  retained table. Deploying this stack does not change the main ghost-igl stack.

Parameters:
  StageName:
    Type: String
    Default: prod
  TablePrefix:
    Type: String
    Default: recon-customer-success
    Description: Override for non-production validation stacks to avoid table-name collisions.
  CognitoUserPoolId:
    Type: String
    Default: us-east-1_rvLy8WLQB
  CognitoClientId:
    Type: String
    Default: 5bpa1cteenctoue24v4e245re8
  SubscriptionsTableName:
    Type: String
    Default: ghost-igl-subscriptions
  ProfilesTableName:
    Type: String
    Default: ghost-igl-profiles
  ClimbProgressTableName:
    Type: String
    Default: recon6-climb-progress
  BookingsTableName:
    Type: String
    Default: recon6-bookings
  CoachingEventsTableName:
    Type: String
    Default: recon6-coaching-events
  PlayerStoreTableName:
    Type: String
    Default: recon-player-store
  PlayerEventsTableName:
    Type: String
    Default: recon-player-events
  ReferralsTableName:
    Type: String
    Default: ghost-igl-referrals
  CrmLogTableName:
    Type: String
    Default: ghost-igl-crm-log
  TestimonialsTableName:
    Type: String
    Default: ghost-igl-testimonials
  # Player-data history read by Player Success diagnostics (Query only; see
  # the PlayerDataHistoryQueryOnly statement below).
  PlayerSnapshotsTableName:
    Type: String
    Default: recon-player-snapshots
  PlayerIdentitiesTableName:
    Type: String
    Default: recon-player-identities
  ProviderHealthTableName:
    Type: String
    Default: recon-player-provider-health
  ActivityTrackingSince:
    Type: String
    Default: ''
    Description: ISO date the activity beacon went live. Before it, missing strategy/match-prep activity is reported as "not recorded".
  FeatureMessaging:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
  FeatureFeedback:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
  OutreachDeliveryMode:
    Type: String
    Default: disabled
    AllowedValues: [disabled, in_app]
    Description: >-
      disabled = messages are recorded, nothing reaches players (default).
      in_app = in-app messages become visible to players. Email is never sent
      by this stack; there is no email transport in the code.
  SyncLegacySuppression:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Mirror opt-outs into the existing CRM job's log (sets marketing_suppressed_at only).
  # ---- Player Success & Support (routes/support.mjs). Everything OFF. ------
  FeatureSupport:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >-
      false = every /cs/.../support and /cs/help route is a 404 (default).
      Turning it on is an Aaron-approved step (docs/player-success/ARCHITECTURE.md §16).
  SupportAttachments:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >-
      Attachment manifests. Keep false: the private attachments bucket and the
      presign route are NOT provisioned (see the commented block under Resources).
  SupportProactive:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Proactive runs may create flagged cases (dry runs work either way). Never contacts a player.
  SupportCopilotModel:
    Type: String
    Default: 'false'
    AllowedValues: ['false']
    Description: >-
      Model-assisted copilot. Only 'false' is allowed until a cost / risk /
      measurement / rollback case is approved; the copilot is deterministic.
  SupportEmailTokenSecretArn:
    Type: String
    Default: ''
    Description: >-
      Secrets Manager ARN of the HMAC secret for support+<token>@ reply
      threading. Empty (default) = token lookups return nothing and plus-
      addressed mail goes to the unmatched review queue. No secret is created
      by this stack.
  ContactKeySecretParam:
    Type: String
    Default: /recon/customer-success/contact-key-secret
    AllowedPattern: '^/[A-Za-z0-9/_.-]+$'
    Description: >-
      Decision D-C1. SSM SecureString (AWS-managed key) holding the HMAC
      secret for contact keys (at least 32 characters). Created outside this
      stack before the first deploy; the function refuses to start without it.
      Never rotate it without migrating stored keys.
  DevOrigin:
    Type: String
    Default: ''
    Description: >-
      Optional extra browser origin for a non-production validation stack
      (for example http://localhost:5173). Leave empty in production.

Conditions:
  MirrorLegacySuppression: !Equals [!Ref SyncLegacySuppression, 'true']
  HasSupportEmailTokenSecret: !Not [!Equals [!Ref SupportEmailTokenSecretArn, '']]
  HasDevOrigin: !Not [!Equals [!Ref DevOrigin, '']]

Globals:
  Function:
    Runtime: nodejs24.x
    Timeout: 30
    MemorySize: 512

Resources:
  CustomerSuccessTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Ref TablePrefix
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: gsi1pk
          AttributeType: S
        - AttributeName: gsi1sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: gsi1
          KeySchema:
            - AttributeName: gsi1pk
              KeyType: HASH
            - AttributeName: gsi1sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  CustomerSuccessApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref StageName
      DefaultRouteSettings:
        ThrottlingBurstLimit: 40
        ThrottlingRateLimit: 20
      # Literal on purpose: SAM silently drops an HttpApi CorsConfiguration
      # whose AllowOrigins is an intrinsic (!If), which left the first deploy
      # with no CORS and every browser preflight 404ing. A non-production
      # stack that needs DevOrigin adds it here by hand; the function's
      # ALLOWED_ORIGINS below still honours DevOrigin.
      CorsConfiguration:
        AllowOrigins:
          - https://r6coaching.com
          - https://www.r6coaching.com
        AllowHeaders:
          - Authorization
          - Content-Type
        AllowMethods:
          - GET
          - POST
          - PUT
          - PATCH
          - OPTIONS
        MaxAge: 600

  CustomerSuccessFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambda/customer-success/
      Handler: index.handler
      Environment:
        Variables:
          COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
          COGNITO_CLIENT_ID: !Ref CognitoClientId
          CS_TABLE: !Ref CustomerSuccessTable
          SUBSCRIPTIONS_TABLE: !Ref SubscriptionsTableName
          PROFILES_TABLE: !Ref ProfilesTableName
          CLIMB_TABLE: !Ref ClimbProgressTableName
          BOOKINGS_TABLE: !Ref BookingsTableName
          COACHING_EVENTS_TABLE: !Ref CoachingEventsTableName
          PLAYER_STORE_TABLE: !Ref PlayerStoreTableName
          PLAYER_EVENTS_TABLE: !Ref PlayerEventsTableName
          REFERRALS_TABLE: !Ref ReferralsTableName
          CRM_LOG_TABLE: !Ref CrmLogTableName
          TESTIMONIALS_TABLE: !Ref TestimonialsTableName
          ACTIVITY_TRACKING_SINCE: !Ref ActivityTrackingSince
          FEATURE_MESSAGING: !Ref FeatureMessaging
          FEATURE_FEEDBACK: !Ref FeatureFeedback
          OUTREACH_DELIVERY_MODE: !Ref OutreachDeliveryMode
          SYNC_LEGACY_SUPPRESSION: !Ref SyncLegacySuppression
          PLAYER_SNAPSHOTS_TABLE: !Ref PlayerSnapshotsTableName
          PLAYER_IDENTITIES_TABLE: !Ref PlayerIdentitiesTableName
          PROVIDER_HEALTH_TABLE: !Ref ProviderHealthTableName
          FEATURE_SUPPORT: !Ref FeatureSupport
          SUPPORT_ATTACHMENTS: !Ref SupportAttachments
          SUPPORT_PROACTIVE: !Ref SupportProactive
          SUPPORT_COPILOT_MODEL: !Ref SupportCopilotModel
          SUPPORT_EMAIL_TOKEN_SECRET_ARN: !Ref SupportEmailTokenSecretArn
          CONTACT_KEY_SECRET_PARAM: !Ref ContactKeySecretParam
          ALLOWED_ORIGINS: !If
            - HasDevOrigin
            - !Sub 'https://r6coaching.com,https://www.r6coaching.com,${DevOrigin}'
            - 'https://r6coaching.com,https://www.r6coaching.com'
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CustomerSuccessTable
        - Statement:
            - Sid: ExistingReconTablesReadOnly
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Query
                - dynamodb:Scan
              Resource:
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${SubscriptionsTableName}
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${SubscriptionsTableName}/index/*
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ProfilesTableName}
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ClimbProgressTableName}
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${BookingsTableName}
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${CoachingEventsTableName}
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${PlayerStoreTableName}
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${PlayerEventsTableName}
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ReferralsTableName}
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ReferralsTableName}/index/*
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${CrmLogTableName}
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TestimonialsTableName}
            # Player Success diagnostics: per-player history is read with
            # Query only (never Scan, never a write) on exactly these tables.
            - Sid: PlayerDataHistoryQueryOnly
              Effect: Allow
              Action:
                - dynamodb:Query
              Resource:
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${PlayerSnapshotsTableName}
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${PlayerIdentitiesTableName}
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ProviderHealthTableName}
            # Decision D-C1: the contact-key HMAC secret (SSM SecureString,
            # AWS-managed key). Read-only, this one parameter.
            - Sid: ContactKeySecretReadOnly
              Effect: Allow
              Action:
                - ssm:GetParameter
              Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ContactKeySecretParam}
            - Sid: CognitoDirectoryReadOnly
              Effect: Allow
              Action:
                - cognito-idp:ListUsers
                - cognito-idp:ListUsersInGroup
              Resource: !Sub arn:${AWS::Partition}:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${CognitoUserPoolId}
        - !If
          - MirrorLegacySuppression
          - Statement:
              - Sid: LegacyCrmSuppressionAttributesOnly
                Effect: Allow
                Action:
                  - dynamodb:UpdateItem
                Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${CrmLogTableName}
                Condition:
                  ForAllValues:StringEquals:
                    dynamodb:Attributes:
                      - email
                      - marketing_suppressed_at
                      - marketing_suppressed_reason
          - !Ref AWS::NoValue
        - !If
          - HasSupportEmailTokenSecret
          - Statement:
              - Sid: SupportEmailTokenSecretReadOnly
                Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref SupportEmailTokenSecretArn
          - !Ref AWS::NoValue
      # Player Success & Support (routes/support.mjs, 35 routes) is registered
      # as three prefix routes rather than one event per route: SAM adds a
      # Lambda permission per event and 60+ statements approach the 20 KB
      # resource-policy limit. The app matches method + path exactly, checks
      # auth and roles per route, and 404s everything when FEATURE_SUPPORT is
      # not 'true', so the prefixes widen nothing.
      Events:
        SupportPlayer:
          Type: HttpApi
          Properties: { ApiId: !Ref CustomerSuccessApi, Path: '/cs/me/support/{proxy+}', Method: ANY }
        SupportStaff:
          Type: HttpApi
          Properties: { ApiId: !Ref CustomerSuccessApi, Path: '/cs/admin/support/{proxy+}', Method: ANY }
        SupportHelp:
          Type: HttpApi
          Properties: { ApiId: !Ref CustomerSuccessApi, Path: '/cs/help/{proxy+}', Method: GET }
        Health:
          Type: HttpApi
          Properties: { ApiId: !Ref CustomerSuccessApi, Path: /cs/health, Method: GET }
        CustomerHome:
          Type: HttpApi
          Properties: { ApiId: !Ref CustomerSuccessApi, Path: /cs/me/home, Method: GET }
        CustomerActivity:
          Type: HttpApi
          Properties: { ApiId: !Ref CustomerSuccessApi, Path: /cs/me/activity, Method: POST }
        AdminOverview:
          Type: HttpApi
          Properties: { ApiId: !Ref CustomerSuccessApi, Path: /cs/admin/overview, Method: GET }
        AdminPlayers:
          Type: HttpApi
          Properties: { ApiId: !Ref CustomerSuccessApi, Path: /cs/admin/players, Method: GET }
        AdminPlayer:
          Type: HttpApi
          Properties: { ApiId: !Ref CustomerSuccessApi, Path: '/cs/admin/players/{key}', Method: GET }
        AdminPlayerHomePreview:
          Type: HttpApi
          Properties: { ApiId: !Ref CustomerSuccessApi, Path: '/cs/admin/players/{key}/home-preview', Method: GET }
        AdminQueue:
          Type: HttpApi
          Properties: { ApiId: !Ref CustomerSuccessApi, Path: /cs/admin/queue, Method: GET }
        AdminQueueDecision:
          Type: HttpApi
          Properties: { ApiId: !Ref CustomerSuccessApi, Path: /cs/admin/queue/decision, Method: POST }
        CustomerMessages:
          Type: HttpApi
          Properties: { ApiId: !Ref CustomerSuccessApi, Path: /cs/me/messages, Method: GET }
        CustomerSendMessage:
          Type: HttpApi
          Properties: { ApiId: !Ref CustomerSuccessApi, Path: /cs/me/messages, Method: POST }
        CustomerReadMessages:
          Type: HttpApi
          Properties: { ApiId: !Ref CustomerSuccessApi, Path: /cs/me/messages/read, Method: POST }
        CustomerGetPreferences:
          Type: HttpApi
          Properties: { ApiId: !Ref CustomerSuccessApi, Path: /cs/me/contact-preferences, Method: GET }
        CustomerPutPreferences:
          Type: HttpApi
          Properties: { ApiId: !Ref CustomerSuccessApi, Path: /cs/me/contact-preferences, Method: PUT }
        AdminConversations:
          Type: HttpApi
          Properties: { ApiId: !Ref CustomerSuccessApi, Path: /cs/admin/conversations, Method: GET }
        AdminConversation:
          Type: HttpApi
          Properties: { ApiId: !Ref CustomerSuccessApi, Path: '/cs/admin/conversations/{key}', Method: GET }
        AdminConversationReply:
          Type: HttpApi
          Properties: { ApiId: !Ref CustomerSuccessApi, Path: '/cs/admin/conversations/{key}/reply', Method: POST }
        AdminPlayerContact:
          Type: HttpApi
          Properties: { ApiId: !Ref CustomerSuccessApi, Path: '/cs/admin/players/{key}/contact', Method: PUT }
        AdminOutreach:
          Type: HttpApi
          Properties: { ApiId: !Ref CustomerSuccessApi, Path: /cs/admin/outreach, Method: GET }
        AdminOutreachRun:
          Type: HttpApi
          Properties: { ApiId: !Ref CustomerSuccessApi, Path: /cs/admin/outreach/run, Method: POST }
        CustomerFeedbackSeen:
          Type: HttpApi
          Properties: { ApiId: !Ref CustomerSuccessApi, Path: /cs/me/feedback/seen, Method: POST }
        CustomerFeedback:
          Type: HttpApi
          Properties: { ApiId: !Ref CustomerSuccessApi, Path: /cs/me/feedback, Method: POST }
        CustomerFeedbackDismiss:
          Type: HttpApi
          Properties: { ApiId: !Ref CustomerSuccessApi, Path: /cs/me/feedback/dismiss, Method: POST }
        AdminFeedback:
          Type: HttpApi
          Properties: { ApiId: !Ref CustomerSuccessApi, Path: /cs/admin/feedback, Method: GET }
        AdminFeedbackResolve:
          Type: HttpApi
          Properties: { ApiId: !Ref CustomerSuccessApi, Path: /cs/admin/feedback/resolve, Method: POST }
        AdminReviews:
          Type: HttpApi
          Properties: { ApiId: !Ref CustomerSuccessApi, Path: /cs/admin/reviews, Method: GET }
        AdminReviewDecision:
          Type: HttpApi
          Properties: { ApiId: !Ref CustomerSuccessApi, Path: /cs/admin/reviews/decision, Method: POST }

  # ---- NOT PROVISIONED (Player Success & Support) -------------------------------
  # Kept as comments so nothing is created by a deploy of this template.
  #
  # Support attachments bucket (needed before SupportAttachments=true):
  #   SupportAttachmentsBucket:
  #     Type: AWS::S3::Bucket
  #     DeletionPolicy: Retain
  #     Properties:
  #       PublicAccessBlockConfiguration: { BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true }
  #       BucketEncryption: { ServerSideEncryptionConfiguration: [{ ServerSideEncryptionByDefault: { SSEAlgorithm: aws:kms } }] }
  #       LifecycleConfiguration: { Rules: [{ Id: expire-support-attachments, Status: Enabled, ExpirationInDays: 180 }] }
  #   plus: s3:PutObject/GetObject scoped to support/* for this function, a
  #   presign route, and a malware-scan step before scanState leaves 'not_uploaded'.
  #
  # Inbound support email: the existing ghost-igl-mail-forward SES receipt
  # rule would invoke support ingestion (service.ingestInboundEmail). No
  # receipt rule, SNS topic or Lambda permission for that exists in this stack.
  #
  # Outbound support email (replies by email): SES identity/DKIM for
  # support@ and the transactional send gate. Not wired; replies are shown in
  # the player's case timeline only.

  CustomerSuccessErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Recon customer-success API is throwing errors.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref CustomerSuccessFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

Outputs:
  CustomerSuccessApiUrl:
    Description: Configure this value as VITE_CUSTOMER_SUCCESS_API_URL after the stack is deployed and verified.
    Value: !Sub https://${CustomerSuccessApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${StageName}
  CustomerSuccessTableName:
    Description: Customer-success single table (retained, point-in-time recovery on).
    Value: !Ref CustomerSuccessTable
